name: Package Artifacts

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      target:
        description: Build target
        required: true
        default: all
        type: choice
        options:
          - all
          - windows-x64
          - macos-arm64
          - macos-x64

permissions:
  contents: write

jobs:
  # ─── macOS 构建 ───────────────────────────────────
  package-mac:
    name: Build macOS (ARM64 DMG)
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'macos-arm64'
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Luna protocol component
        run: pnpm run test:protocol

      - name: Setup Rust toolchain
        run: pnpm run init:rust

      - name: Build macOS DMG (Ad Hoc, no notarization)
        env:
          ELECTRON_BUILDER_ALLOW_HARD_LINKS: "false"
        run: pnpm run pack:mac:arm64

      - name: Verify macOS Ad Hoc signature
        shell: bash
        run: |
          app_path="$(find release -type d -name '*.app' -print -quit)"
          test -n "$app_path" || { echo "未找到 macOS App"; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$app_path"
          codesign --display --verbose=4 "$app_path" 2>&1 | grep -q 'Signature=adhoc' || {
            echo "macOS App 不是 Ad Hoc 签名: $app_path"
            exit 1
          }
          echo "Ad Hoc 签名校验通过: $app_path"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: luna-ai-cut-macos-arm64-dmg
          path: release*/**/*.dmg
          if-no-files-found: error

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: release*/**/*.dmg

  # ─── macOS x64 (Intel) 构建 ────────────────────────
  package-mac-x64:
    name: Build macOS (Intel x64 DMG)
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')) || (github.event_name == 'workflow_dispatch' && (inputs.target == 'all' || inputs.target == 'macos-x64'))
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Luna protocol component
        run: pnpm run test:protocol

      - name: Setup Rust toolchain (with x64 cross-compile target)
        env:
          CROSS_TARGET: x86_64-apple-darwin
        run: pnpm run init:rust

      - name: Prepare ONNX Runtime for macOS x64
        shell: bash
        run: |
          archive="$RUNNER_TEMP/onnxruntime-osx-x86_64-1.23.2.tgz"
          runtime_root="$RUNNER_TEMP/onnxruntime-osx-x86_64-1.23.2"
          curl --fail --location --retry 3 \
            --output "$archive" \
            "https://github.com/microsoft/onnxruntime/releases/download/v1.23.2/onnxruntime-osx-x86_64-1.23.2.tgz"
          echo "d10359e16347b57d9959f7e80a225a5b4a66ed7d7e007274a15cae86836485a6  $archive" | shasum -a 256 --check
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          cp "$runtime_root"/lib/*.dylib luna-render-core/
          echo "ORT_LIB_LOCATION=$runtime_root/lib" >> "$GITHUB_ENV"
          echo "ORT_PREFER_DYNAMIC_LINK=1" >> "$GITHUB_ENV"

      - name: Build macOS x64 DMG (Ad Hoc, no notarization)
        env:
          ELECTRON_BUILDER_ALLOW_HARD_LINKS: "false"
        run: pnpm run pack:mac:x64

      - name: Verify macOS x64 Ad Hoc signature
        shell: bash
        run: |
          app_path="$(find release -type d -name '*.app' -print -quit)"
          test -n "$app_path" || { echo "未找到 macOS App"; exit 1; }
          native_dir="$app_path/Contents/Resources/luna-render-core"
          test -f "$native_dir/libonnxruntime.1.23.2.dylib" || {
            echo "Intel App 缺少 ONNX Runtime 运行库"
            exit 1
          }
          render_core="$native_dir/luna-render-core.node"
          test -f "$render_core" || { echo "Intel App 缺少原生组件: $render_core"; exit 1; }
          otool -L "$render_core" | grep -q 'libonnxruntime' && {
            echo "Intel App 的渲染核心不应依赖 ONNX Runtime"
            exit 1
          }
          for native_file in \
            "$native_dir/sam-segmentation-worker" \
            "$native_dir/semantic-segmentation-worker" \
            "$native_dir/specialized-segmentation-worker"; do
            test -f "$native_file" || { echo "Intel App 缺少原生组件: $native_file"; exit 1; }
            otool -L "$native_file" | grep -q '@rpath/libonnxruntime' && {
              echo "Intel App 的 ONNX Runtime 加载路径无效: $native_file"
              exit 1
            }
            otool -L "$native_file" | grep -q '@loader_path/libonnxruntime' || {
              echo "Intel App 的 ONNX Runtime 加载路径缺失: $native_file"
              exit 1
            }
          done
          codesign --verify --deep --strict --verbose=2 "$app_path"
          codesign --display --verbose=4 "$app_path" 2>&1 | grep -q 'Signature=adhoc' || {
            echo "macOS x64 App 不是 Ad Hoc 签名: $app_path"
            exit 1
          }
          echo "Ad Hoc 签名校验通过: $app_path"

      - name: Upload macOS x64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: luna-ai-cut-macos-x64-dmg
          path: release*/**/*.dmg
          if-no-files-found: error

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: release*/**/*.dmg

  # ─── Windows 构建 ─────────────────────────────────
  package-win:
    name: Build Windows (x64 NSIS)
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'windows-x64'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Luna protocol component
        run: pnpm run test:protocol

      - name: Setup Rust toolchain
        run: pnpm run init:rust

      - name: Build Windows NSIS
        env:
          ELECTRON_BUILDER_ALLOW_HARD_LINKS: "false"
        run: pnpm run pack:win:x64

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: luna-ai-cut-windows-x64-nsis
          path: release*/**/*Setup*.exe
          if-no-files-found: error

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: release*/**/*Setup*.exe
