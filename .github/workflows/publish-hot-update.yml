name: Publish Hot Update

on:
  push:
    tags:
      - 'hot/v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Hot update version, e.g. 1.5.1-hot.4'
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:app
      - name: Build renderer hot-update archive
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#hot/v}"
          fi
          node scripts/publish-hot-update.mjs --version "$version"
      - uses: actions/upload-artifact@v4
        with:
          name: luna-ai-cut-renderer-hot-update
          path: release/*/hot-update/renderer-*.zip
          if-no-files-found: error
