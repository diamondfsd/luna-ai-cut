name: LunaVirtualCamera
options:
  bundleIdPrefix: com.diamondfsd.luna
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: 5.9
    MACOSX_DEPLOYMENT_TARGET: 15.0
    DEVELOPMENT_TEAM: ""
targets:
  LunaCameraHost:
    type: application
    platform: macOS
    sources:
      - path: Host
      - path: Sources
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.diamondfsd.luna.virtualcamera.host
      INFOPLIST_FILE: Host/Info.plist
      CODE_SIGN_ENTITLEMENTS: Config/Host.entitlements
      REGISTER_APP_GROUPS: YES
    dependencies:
      - target: LunaCameraExtension
        embed: true
  LunaCameraExtension:
    type: system-extension
    platform: macOS
    sources:
      - path: Extension
      - path: Sources
    settings:
      PRODUCT_NAME: com.diamondfsd.luna.virtualcamera.host.extension
      PRODUCT_BUNDLE_IDENTIFIER: com.diamondfsd.luna.virtualcamera.host.extension
      INFOPLIST_FILE: Extension/Info.plist
      CODE_SIGN_ENTITLEMENTS: Config/Extension.entitlements
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: YES
      REGISTER_APP_GROUPS: YES
