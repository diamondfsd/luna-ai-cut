<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#272729">
  <meta name="referrer" content="no-referrer">
  <title>Luna AI Cut 手机访问</title>
  <link rel="stylesheet" href="./app.css">
  <link rel="stylesheet" href="./app-actions.css">
</head>
<body>
  <div class="boot-screen" id="boot-screen">正在打开...</div>

  <section class="wechat-guide" id="wechat-guide" hidden>
    <header class="wechat-guide-bar">Luna AI Cut</header>
    <main class="wechat-guide-main">
      <span>手机访问</span>
      <h1>请在浏览器中打开</h1>
      <p>微信内无法稳定下载原文件。请点击右上角菜单，选择“在浏览器打开”。</p>
    </main>
  </section>

  <div class="app-shell" id="app-shell" hidden>
    <header class="topbar">
      <div class="global-nav">
        <div class="tabs" role="tablist" aria-label="资源来源">
          <button class="tab active" data-source="export" role="tab" aria-selected="true">导出文件</button>
          <button class="tab" data-source="local" role="tab" aria-selected="false">本地资源</button>
          <button class="tab" data-source="files" role="tab" aria-selected="false">共享文件</button>
        </div>
        <div class="share-status"><span class="status-dot"></span><span>手机访问</span></div>
      </div>
      <div class="context-nav">
        <strong>手机访问</strong>
        <div class="context-actions">
          <p id="summary">正在读取资源</p>
          <button class="file-back-button" id="file-back" type="button" hidden>返回上一级</button>
          <button class="upload-button" id="upload-trigger" type="button">上传素材</button>
        </div>
      </div>
    </header>
    <main>
      <div id="error"></div>
      <div class="photo-grid" id="grid"><div class="loading">正在加载...</div></div>
      <div class="more" id="more" hidden aria-live="polite">正在加载更多...</div>
    </main>
  </div>

  <div class="selection-bar" id="selection-bar" hidden>
    <div class="selection-summary">
      <span id="selection-count">已选择 0 项</span>
      <span class="selection-size" id="selection-size"></span>
      <label class="zip-option"><input id="zip-download" type="checkbox">打包成 ZIP</label>
    </div>
    <button id="download-selected" disabled>下载所选资源</button>
  </div>

  <input id="upload-files" class="upload-input" type="file" accept="image/*,video/*" multiple>

  <div class="viewer" id="viewer" role="dialog" aria-modal="true" hidden>
    <div class="viewer-layout">
      <div class="viewer-header"><div class="viewer-heading"><div class="viewer-title" id="viewer-title"></div><div class="viewer-position" id="viewer-position"></div></div><button class="close-button" id="close" aria-label="关闭"></button></div>
      <div class="viewer-media" id="viewer-media"></div>
      <div class="viewer-footer"><div class="viewer-info" id="viewer-info"></div><a class="download-button" id="download">下载原文件</a></div>
    </div>
  </div>
  <script src="./app.js" defer></script>
</body>
</html>
