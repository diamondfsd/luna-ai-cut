<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>更新日志 — Luna AI Cut</title>
    <meta name="description" content="Luna AI Cut 完整的版本发布历史与更新说明。" />

    <link rel="icon" type="image/png" href="assets/favicon.png" />
    <link rel="stylesheet" href="style.css" />
    <style>
      /* ── Changelog page specific ── */
      .hero-changelog {
        padding: 120px 24px 60px;
        text-align: center;
        background: var(--parchment);
        border-bottom: 1px solid var(--hairline);
      }
      .hero-changelog .eyebrow {
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--blue);
        margin-bottom: 10px;
      }
      .hero-changelog .section-desc { margin-left: auto; margin-right: auto; }

      .cl-timeline {
        max-width: 720px;
        margin: 0 auto;
        display: grid;
        gap: 20px;
      }

      .cl-entry {
        background: var(--canvas);
        border: 1px solid var(--hairline);
        border-radius: var(--radius-card);
        padding: 32px;
        transition: transform 200ms ease, box-shadow 200ms ease;
      }
      .cl-entry:hover {
        transform: translateY(-1px);
        box-shadow: rgba(0, 0, 0, 0.04) 0 4px 16px 0;
      }

      .cl-entry-head {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 16px;
      }

      .cl-version {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-family: var(--font-display);
        font-size: 22px;
        font-weight: 600;
        color: var(--ink);
        white-space: nowrap;
      }
      .cl-version .cl-hot-badge {
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.03em;
        text-transform: uppercase;
        padding: 2px 8px;
        border-radius: 999px;
        background: rgba(0, 102, 204, 0.08);
        color: var(--blue);
      }

      .cl-entry h2,
      .cl-entry h3 {
        font-family: var(--font-display);
        font-weight: 600;
        color: var(--ink);
        margin: 20px 0 10px;
      }
      .cl-entry h2 { font-size: 22px; }
      .cl-entry h3 { font-size: 17px; }
      .cl-entry h2:first-child,
      .cl-entry h3:first-child { margin-top: 0; }

      .cl-entry ul {
        list-style: none;
        padding: 0;
        margin: 0 0 10px;
        display: grid;
        gap: 6px;
      }
      .cl-entry ul:last-child { margin-bottom: 0; }

      .cl-entry li {
        position: relative;
        padding-left: 18px;
        font-size: 15px;
        line-height: 1.55;
        color: var(--muted);
      }
      .cl-entry li::before {
        content: '';
        position: absolute;
        left: 0;
        top: 9px;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--hairline);
        border: 1px solid rgba(0,0,0,0.06);
      }

      .cl-entry li strong { color: var(--ink); font-weight: 600; }
      .cl-entry code {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 13px;
        background: var(--parchment);
        padding: 1px 6px;
        border-radius: 4px;
        color: var(--ink);
      }
      .cl-entry pre {
        background: #101012;
        border-radius: 10px;
        padding: 12px 16px;
        overflow-x: auto;
        margin: 12px 0;
      }
      .cl-entry pre code {
        background: transparent;
        padding: 0;
        color: #f5f5f7;
        font-size: 13px;
      }
      .cl-entry p { font-size: 15px; color: var(--muted); line-height: 1.55; margin: 10px 0; }
      .cl-entry p:first-child { margin-top: 0; }
      .cl-entry br { display: none; }

      .cl-empty {
        text-align: center;
        padding: 80px 24px;
        color: var(--muted);
      }
      .cl-empty p { font-size: 15px; line-height: 1.6; }
      .cl-empty code {
        background: var(--parchment);
        padding: 2px 8px;
        border-radius: 6px;
        font-size: 13px;
      }

      @media (max-width: 640px) {
        .cl-entry { padding: 20px; }
        .cl-version { font-size: 18px; }
        .cl-entry-head { flex-wrap: wrap; }
      }
    </style>
  </head>
  <body>
    <!-- ===== Global Nav ===== -->
    <nav class="global-nav">
      <div class="nav-inner">
        <div class="nav-brand">
          <img class="nav-logo" src="assets/icon.png" alt="Luna AI Cut" width="18" height="18" />
          Luna AI Cut
        </div>
        <div class="nav-links">
          <a href="index.html">返回首页</a>
          <a href="index.html#download">下载</a>
          <a href="index.html#features">功能</a>
          <a href="https://github.com/diamondfsd/luna-ai-cut" target="_blank" rel="noopener" class="nav-github">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 0C5.37 0 0 5.37 0 12c0 5.3 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61-.546-1.385-1.335-1.755-1.335-1.755-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 21.795 24 17.295 24 12 24 5.37 18.63 0 12 0z"/>
            </svg>
            <span>GitHub</span>
          </a>
        </div>
      </div>
    </nav>

    <!-- ===== Hero ===== -->
    <section class="hero-changelog">
      <div class="section-inner">
        <p class="eyebrow">Luna AI Cut Desktop</p>
        <h1 class="section-title">更新日志</h1>
        <p class="section-desc">完整的版本发布历史，每次更新都为了让体验更好</p>
      </div>
    </section>

    <!-- ===== Timeline ===== -->
    <main>
      <section class="section section-white">
        <div class="section-inner" id="cl-root">
          <!-- 动态渲染 -->
        </div>
      </section>
    </main>

    <!-- ===== Footer ===== -->
    <footer class="footer">
      <div class="footer-inner">
        <div class="footer-brand">
          <img class="footer-logo" src="assets/icon.png" alt="Luna AI Cut" width="16" height="16" />
          Luna AI Cut
        </div>
        <div class="footer-links">
          <a href="index.html">返回首页</a>
          <a href="https://github.com/diamondfsd/luna-ai-cut" target="_blank" rel="noopener">GitHub</a>
          <a href="https://github.com/diamondfsd/luna-ai-cut/issues" target="_blank" rel="noopener">问题反馈</a>
        </div>
        <p class="footer-copy">
          开源项目 · 基于 MIT 协议发布。<br/>
          与 Insta360 公司无关联。Insta360 是 Arashi Vision 公司的注册商标。
        </p>
      </div>
    </footer>

    <script src="changelog-data.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const root = document.getElementById('cl-root')
        if (!root) return

        // 平滑滚动
        document.querySelectorAll('a[href^="#"]').forEach((link) => {
          link.addEventListener('click', (e) => {
            const target = document.querySelector(link.getAttribute('href'))
            if (target) { e.preventDefault(); target.scrollIntoView({ behavior: 'smooth', block: 'start' }) }
          })
        })

        if (typeof CHANGELOG_DATA === 'undefined' || !CHANGELOG_DATA.length) {
          root.innerHTML = `
            <div class="cl-empty">
              <p>暂无更新日志数据。</p>
              <p>请在项目根目录执行：<code>node landing/generate-changelog.cjs</code></p>
            </div>
          `
          return
        }

        const html = CHANGELOG_DATA.map(entry => `
          <article class="cl-entry">
            <div class="cl-entry-head">
              <div class="cl-version">
                ${entry.isHotfix
                  ? `v${entry.version} <span class="cl-hot-badge">Hotfix</span>`
                  : `v${entry.version}`
                }
              </div>
            </div>
            <div class="cl-body">${entry.bodyHtml}</div>
          </article>
        `).join('\n')

        root.innerHTML = `<div class="cl-timeline">${html}</div>`
      })
    </script>
  </body>
</html>
